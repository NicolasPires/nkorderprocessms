server:
  port: 8080

spring:
  application:
    name: nk-order-process-ms
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/nk_order_process}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger
